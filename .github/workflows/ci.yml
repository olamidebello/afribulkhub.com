name: Verify marketplace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node tests/money.test.cjs
      - run: python -m py_compile app.py deploy/backup.py
      - run: pip install ansible-core==2.18.2
      - run: ansible-playbook -i localhost, deploy/deploy.yml --syntax-check
      - run: ansible-playbook -i localhost, deploy/pull-and-deploy.yml --syntax-check
      - run: ansible-playbook -i localhost, deploy/pull-and-install.yml --syntax-check
